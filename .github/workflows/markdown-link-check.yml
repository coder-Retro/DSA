name: Markdown Link Check

# Verifies links inside README.md / CODE_STYLE.md / LICENSE.md and every
# nested README don't 404. Runs on doc changes and weekly, since links can
# rot even without you touching the file.
on:
  push:
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 * * 1" # every Monday
  workflow_dispatch: {}

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".github/mlc-config.json"
