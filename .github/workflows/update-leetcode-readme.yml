name: Update LeetCode README Counts

# Recounts .cpp solutions under LeetCode/1.Easy, 2.Medium, 3.Hard whenever
# one is added/removed, and commits the updated counts back to
# LeetCode/README.md automatically — no manual editing needed.
on:
  push:
    branches: [main]
    paths:
      - "LeetCode/1.Easy/**/*.cpp"
      - "LeetCode/2.Medium/**/*.cpp"
      - "LeetCode/3.Hard/**/*.cpp"
  workflow_dispatch: {}

# Needed so the workflow's own commit can be pushed back to the repo.
permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update counts
        run: python3 .github/scripts/update_leetcode_readme.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- LeetCode/README.md; then
            echo "No count changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LeetCode/README.md
          git commit -m "chore: update LeetCode solved-problem counts [skip ci]"
          git push
